<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" font-family="'JetBrains Mono','Fira Code',Consolas,'DejaVu Sans Mono',monospace">
  <defs>
    <pattern id="dots" width="32" height="32" patternUnits="userSpaceOnUse">
      <rect x="15" y="15" width="2" height="2" fill="#a3e635" fill-opacity="0.10"/>
    </pattern>
    <linearGradient id="scan" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#a3e635" stop-opacity="0"/>
      <stop offset="1" stop-color="#a3e635" stop-opacity="0.14"/>
    </linearGradient>
    <clipPath id="reveal"><rect x="40" y="96" width="0" height="100">
      <animate attributeName="width" from="0" to="760" dur="1.5s" begin="0.7s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines=".2 .8 .2 1"/>
    </rect></clipPath>
    <clipPath id="frame"><rect x="1" y="1" width="1278" height="358"/></clipPath>
  </defs>

  <rect width="1280" height="360" fill="#000000"/>
  <rect width="1280" height="360" fill="url(#dots)"/>

  <g clip-path="url(#frame)">
    <rect x="-200" y="0" width="200" height="360" fill="url(#scan)">
      <animate attributeName="x" from="-200" to="1280" dur="7s" begin="2.2s" repeatCount="indefinite"/>
    </rect>
  </g>

  <rect x="1" y="1" width="1278" height="358" fill="none" stroke="#a3e635" stroke-width="2" stroke-dasharray="3272" stroke-dashoffset="3272">
    <animate attributeName="stroke-dashoffset" from="3272" to="0" dur="1.6s" begin="0s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines=".2 .8 .2 1"/>
  </rect>

  <g stroke="#a3e635" stroke-width="4" fill="none" opacity="0">
    <path d="M1 28 V1 H28"/><path d="M1252 1 H1279 V28"/>
    <path d="M1 332 V359 H28"/><path d="M1252 359 H1279 V332"/>
    <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="1.4s" fill="freeze"/>
  </g>

  <g opacity="0">
    <text x="48" y="68" font-size="15" letter-spacing="2" fill="#a3e635" fill-opacity="0.6">~/abdnoman.com</text>
    <rect x="1066" y="55" width="10" height="10" fill="#a3e635">
      <animate attributeName="opacity" values="1;0.2;1" dur="1.8s" repeatCount="indefinite"/>
    </rect>
    <text x="1232" y="68" text-anchor="end" font-size="15" letter-spacing="2" fill="#a3e635" fill-opacity="0.6">OPEN TO WORK</text>
    <animate attributeName="opacity" from="0" to="1" dur="0.6s" begin="0.4s" fill="freeze"/>
  </g>

  <g clip-path="url(#reveal)">
    <text x="48" y="172" font-size="72" font-weight="700" fill="#a3e635">Abdullah Al Noman</text>
  </g>
  <rect x="48" y="96" width="14" height="82" fill="#a3e635">
    <animate attributeName="x" from="40" to="792" dur="1.5s" begin="0.7s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines=".2 .8 .2 1"/>
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1.1s" begin="2.2s" repeatCount="indefinite"/>
  </rect>

  <rect x="48" y="206" width="0" height="3" fill="#a3e635">
    <animate attributeName="width" from="0" to="96" dur="0.7s" begin="1.8s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines=".2 .8 .2 1"/>
  </rect>

  <g opacity="0">
    <text x="48" y="256" font-size="26" fill="#a3e635">Backend  &#183;  AI  &#183;  Linux  &#183;  DevOps</text>
    <animate attributeName="opacity" from="0" to="1" dur="0.8s" begin="2.0s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" from="0 10" to="0 0" dur="0.8s" begin="2.0s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines=".2 .8 .2 1"/>
  </g>

  <g opacity="0">
    <text x="48" y="312" font-size="15" letter-spacing="1" fill="#a3e635" fill-opacity="0.6">2x Hackathon Winner  /  Daffodil International University  /  Dhaka</text>
    <animate attributeName="opacity" from="0" to="1" dur="0.8s" begin="2.5s" fill="freeze"/>
  </g>
</svg>
